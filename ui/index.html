<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VN66 Studio</title>
<style>
:root{
  --bg:#14161a; --panel:#1c1f25; --panel2:#242830; --line:#323743; --text:#e8eaee; --dim:#98a0ae;
  --accent:#f0a23b; --accent-ink:#1a1206; --ok:#4cc38a; --bad:#ef6a6a; --key:#2b303a; --key-hi:#3a4150;
  --u:58px; --radius:10px;
}
@media (prefers-color-scheme: light){
  :root{ --bg:#f3f1ec; --panel:#ffffff; --panel2:#f1eee8; --line:#d9d4c9; --text:#1d1f23; --dim:#666c78;
    --accent:#c9741a; --accent-ink:#fff; --key:#f7f4ee; --key-hi:#ece7dc; }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;user-select:none}
button,select,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 span{color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;color:var(--dim)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--bad)}
.pill.on i{background:var(--ok)} .pill.demo i{background:var(--accent)}
.spacer{flex:1}
main{flex:1;display:flex;min-height:0}
nav{width:168px;padding:14px 10px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:4px}
nav button{all:unset;cursor:pointer;padding:9px 12px;border-radius:8px;color:var(--dim);font-weight:550}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.sel{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--accent)}
nav button:focus-visible,.btn:focus-visible,.chip:focus-visible,.key:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
nav .foot{margin-top:auto;font-size:11.5px;color:var(--dim);padding:0 12px}
#view{flex:1;overflow:auto;padding:22px 26px 40px}
h2{font-size:19px;margin:0 0 4px;font-weight:650} .sub{color:var(--dim);margin:0 0 18px;max-width:70ch}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim);margin:18px 0 8px;font-weight:650}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
@media (max-width:1100px){.grid2{grid-template-columns:1fr}}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);padding:7px 14px;border-radius:8px;font-weight:550}
.btn:hover{border-color:var(--dim)} .btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.btn.small{padding:3px 9px;font-size:12.5px}
.chip{cursor:pointer;border:1px solid var(--line);background:var(--panel2);padding:5px 10px;border-radius:7px;font-size:13px;min-width:38px;text-align:center}
.chip:hover{border-color:var(--accent)} .chip.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
input[type=text],input[type=number],select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 9px;user-select:text}
input[type=range]{accent-color:var(--accent);width:100%}
label.f{display:block;color:var(--dim);font-size:12.5px;margin:12px 0 4px}
.kbwrap{overflow-x:auto;padding:4px 0 10px}
.kb{position:relative;width:calc(var(--u)*16);height:calc(var(--u)*5);margin:0 auto}
.key{position:absolute;padding:0;margin:0;border:1px solid var(--line);background:var(--key);border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5px;font-weight:600;line-height:1.1;overflow:hidden;box-shadow:0 2px 0 var(--line)}
.key:hover{background:var(--key-hi)}
.key.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.key.changed::after{content:"";position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--accent)}
.key small{position:absolute;left:5px;bottom:3px;font-size:9.5px;color:var(--dim);font-weight:500}
.key.knob{border-radius:50%}
.key.knobside{border-radius:8px;font-size:15px}
.swatch{width:26px;height:26px;border-radius:6px;border:2px solid var(--line);cursor:pointer;padding:0}
.swatch.sel{border-color:var(--text)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mode{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:10px 12px;text-align:left;font-weight:550}
.mode.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.list{display:flex;flex-direction:column;gap:4px}
.item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:1px solid transparent;cursor:pointer}
.item:hover{background:var(--panel2)} .item.sel{background:var(--panel2);border-color:var(--line)}
.item .n{width:26px;color:var(--dim);font-variant-numeric:tabular-nums} .item .t{flex:1} .item.empty .t{color:var(--dim)}
.ev{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:7px;background:var(--panel2);font-size:13px}
.ev b{min-width:52px;font-weight:600} .ev .x{margin-left:auto}
.ev.down b{color:var(--ok)} .ev.up b{color:var(--bad)} .ev.delay b{color:var(--dim)}
.meter{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden} .meter i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%} td,th{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left} th{color:var(--dim);font-weight:600;font-size:12.5px}
kbd{background:var(--key);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 7px;font:600 12px "Segoe UI",sans-serif}
.empty-state{max-width:560px;margin:8vh auto;text-align:center}
.empty-state h2{font-size:22px;margin-bottom:10px}
.steps{text-align:left;margin:18px auto;display:inline-block;color:var(--dim)} .steps li{margin:6px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:10px;box-shadow:0 8px 30px #0006;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80vw}
#toast.show{opacity:1} #toast.err{border-color:var(--bad)} #toast.good{border-color:var(--ok)}
#busy{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:9}
#busy.show{display:flex} #busy div{background:var(--panel);border:1px solid var(--line);padding:16px 26px;border-radius:12px;font-weight:600}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:22px;max-width:440px}
dialog::backdrop{background:#0008} dialog p{margin:0 0 18px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 0}
.switch input{width:18px;height:18px;accent-color:var(--accent)}
.note{color:var(--dim);font-size:12.5px}
.banner{background:color-mix(in srgb,var(--accent) 16%,var(--panel));border:1px solid var(--accent);border-radius:9px;padding:8px 14px;margin-bottom:16px}
.sticky{position:sticky;top:-22px;z-index:2;background:var(--bg);padding:8px 0}
</style>
</head>
<body>
<header>
  <h1>VN66 <span>Studio</span></h1>
  <div id="pill" class="pill"><i></i><span>Looking for keyboard…</span></div>
  <div class="spacer"></div>
  <button class="btn small" id="demoBtn"></button>
</header>
<main>
  <nav id="nav"></nav>
  <section id="view"></section>
</main>
<div id="toast" role="status"></div>
<div id="busy"><div id="busyText">Writing to keyboard…</div></div>
<dialog id="dlg"><p id="dlgText"></p><div class="row" style="justify-content:flex-end"><button class="btn" id="dlgNo">Cancel</button><button class="btn primary" id="dlgYes">OK</button></div></dialog>

<script>
"use strict";
const TOKEN = "__TOKEN__";
const $ = (s, r = document) => r.querySelector(s);
const el = (tag, attrs = {}, ...kids) => {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v;
    else if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, ""); else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;
};

/* ---------- key tables ---------- */
const HID = {40:"Enter",41:"Esc",42:"Backspace",43:"Tab",44:"Space",45:"-",46:"=",47:"[",48:"]",49:"\\",50:"# ~ (ISO)",51:";",52:"'",53:"`",54:",",55:".",56:"/",57:"Caps Lock",
  70:"Print Screen",71:"Scroll Lock",72:"Pause",73:"Insert",74:"Home",75:"Page Up",76:"Delete",77:"End",78:"Page Down",79:"→",80:"←",81:"↓",82:"↑",
  83:"Num Lock",84:"Num /",85:"Num *",86:"Num -",87:"Num +",88:"Num Enter",98:"Num 0",99:"Num .",100:"\ | (ISO)",101:"Menu",
  224:"L Ctrl",225:"L Shift",226:"L Alt",227:"L Win",228:"R Ctrl",229:"R Shift",230:"R Alt",231:"R Win",
  240:"Mouse Left",241:"Mouse Right",242:"Mouse Middle",243:"Mouse Forward",244:"Mouse Back"};
for (let i = 0; i < 26; i++) HID[4 + i] = String.fromCharCode(65 + i);
for (let i = 1; i <= 9; i++) { HID[29 + i] = String(i); HID[88 + i] = "Num " + i; }
HID[39] = "0";
for (let i = 1; i <= 12; i++) HID[57 + i] = "F" + i;
for (let i = 13; i <= 24; i++) HID[91 + i] = "F" + i;
const CODE = {Enter:40,Escape:41,Backspace:42,Tab:43,Space:44,Minus:45,Equal:46,BracketLeft:47,BracketRight:48,Backslash:49,Semicolon:51,Quote:52,Backquote:53,Comma:54,Period:55,Slash:56,CapsLock:57,
  PrintScreen:70,ScrollLock:71,Pause:72,Insert:73,Home:74,PageUp:75,Delete:76,End:77,PageDown:78,ArrowRight:79,ArrowLeft:80,ArrowDown:81,ArrowUp:82,NumLock:83,NumpadDivide:84,NumpadMultiply:85,NumpadSubtract:86,NumpadAdd:87,NumpadEnter:88,Numpad0:98,NumpadDecimal:99,IntlBackslash:100,ContextMenu:101,
  ControlLeft:224,ShiftLeft:225,AltLeft:226,MetaLeft:227,ControlRight:228,ShiftRight:229,AltRight:230,MetaRight:231,Digit0:39};
for (let i = 0; i < 26; i++) CODE["Key" + String.fromCharCode(65 + i)] = 4 + i;
for (let i = 1; i <= 9; i++) { CODE["Digit" + i] = 29 + i; CODE["Numpad" + i] = 88 + i; }
for (let i = 1; i <= 12; i++) CODE["F" + i] = 57 + i;
for (let i = 13; i <= 24; i++) CODE["F" + i] = 91 + i;
const range = (a, b) => Array.from({length: b - a + 1}, (_, i) => a + i);
const KEY_GROUPS = [["Letters", range(4, 29)], ["Numbers", range(30, 39)], ["Function", [...range(58, 69), ...range(104, 115)]],
  ["Editing & navigation", [41, 43, 57, 42, 40, 44, 73, 76, 74, 77, 75, 78, 82, 81, 80, 79, 70, 71, 72, 101]],
  ["Symbols", [53, 45, 46, 47, 48, 49, 50, 100, 51, 52, 54, 55, 56]], ["Modifiers", range(224, 231)], ["Numpad", range(83, 99)]];
const MODS = [[0, "None"], [224, "Ctrl"], [225, "Shift"], [226, "Alt"], [227, "Win"]];
const MEDIA = [["Play / Pause", [3,0,205,0]], ["Next track", [3,0,181,0]], ["Previous track", [3,0,182,0]], ["Stop", [3,0,183,0]],
  ["Mute", [3,0,226,0]], ["Volume up", [3,0,233,0]], ["Volume down", [3,0,234,0]], ["Media player", [3,0,131,1]],
  ["Screen brightness +", [3,0,111,0]], ["Screen brightness −", [3,0,112,0]], ["Calculator", [3,0,146,1]], ["Mail", [3,0,138,1]],
  ["This PC", [3,0,148,1]], ["Browser home", [3,0,35,2]], ["Web search", [3,0,33,2]]];
const MOUSE = [["Left click", [1,0,240,0]], ["Right click", [1,0,241,0]], ["Middle click", [1,0,242,0]], ["Forward", [1,0,243,0]],
  ["Back", [1,0,244,0]], ["Scroll up", [1,0,245,1]], ["Scroll down", [1,0,245,255]]];
const MACRO_TRIGGERS = [[0, "Play the set number of times"], [1, "Toggle: press to start, press to stop"], [2, "Repeat while held"]];
const same = (a, b) => a[0] === b[0] && a[1] === b[1] && a[2] === b[2] && a[3] === b[3];
function entryLabel(e, long) {
  const [a, b, c, d] = e;
  if (!a && !b && !c && !d) return long ? "Disabled" : "∅";
  if (a === 0) return (b ? (MODS.find(m => m[0] === b) || [0, HID[b] || "?"])[1] + " + " : "") + (HID[c] || "0x" + c.toString(16)) + (d ? " + " + (HID[d] || d) : "");
  if (a === 10) return "Fn";
  if (a === 9) return long ? "Macro " + (c + 1) + " (" + ((S.config.macros[c] || {}).name || "empty") + ")" : "M" + (c + 1);
  const hit = [...MEDIA, ...MOUSE].find(m => same(m[1], e));
  return hit ? hit[0] : "Custom " + e.map(x => x.toString(16).padStart(2, "0")).join(" ");
}

/* ---------- physical layout (x, y, width in key units; i = firmware matrix index) ---------- */
const KEYS = [];
function rowOf(y, x, items) { for (const [l, i, w = 1] of items) { KEYS.push({l, i, x, y, w}); x += w; } }
rowOf(0, 0, [["Esc",1],["1",7],["2",13],["3",19],["4",25],["5",31],["6",37],["7",43],["8",49],["9",55],["0",61],["-",67],["=",73],["Backspace",79,2]]);
rowOf(1, 0, [["Tab",2,1.5],["Q",8],["W",14],["E",20],["R",26],["T",32],["Y",38],["U",44],["I",50],["O",56],["P",62],["[",68],["]",74],["\\",80,1.5],["PgUp",86]]);
rowOf(2, 0, [["Caps",3,1.75],["A",9],["S",15],["D",21],["F",27],["G",33],["H",39],["J",45],["K",51],["L",57],[";",63],["'",69],["Enter",81,2.25],["PgDn",87]]);
rowOf(3, 0, [["Shift",4,2.25],["Z",16],["X",22],["C",28],["V",34],["B",40],["N",46],["M",52],[",",58],[".",64],["/",70],["Shift",76,1.75],["↑",82]]);
rowOf(4, 0, [["Ctrl",5,1.25],["Win",17,1.25],["Alt",23,1.25],["Space",41,6.25],["Alt",53],["Fn",59],["Ctrl",71],["←",77],["↓",83],["→",89]]);
const knobKeys = () => [{l: "Knob turn left", s: "↺", i: S.knob.left}, {l: "Knob press", s: "●", i: S.knob.press}, {l: "Knob turn right", s: "↻", i: S.knob.right}];
const keyName = i => (KEYS.find(k => k.i === i) || knobKeys().find(k => k.i === i) || {l: "?"}).l;

/* ---------- state ---------- */
let S = null, tab = "keys", busy = false;
let layer = "base", draftFn = null, draftKeys = null, selKey = null, assignTab = "key", assignMod = 0, capture = false;
let lightDraft = null, lightTimer = null, paint = null, paintColour = "#ff3b30", painting = false;
let macroSel = 0, macroDraft = null, recording = false, recLast = 0, recHeld = new Set();
let profileList = {profiles: [], backups: []};
const clone = o => JSON.parse(JSON.stringify(o));

async function api(path, body = {}, busyText) {
  if (busyText) { busy = true; $("#busyText").textContent = busyText; $("#busy").classList.add("show"); }
  try {
    const r = await fetch(path, {method: "POST", headers: {"Content-Type": "application/json", "X-Token": TOKEN}, body: JSON.stringify(body)});
    const j = await r.json();
    if (!r.ok) { if (j.state) adopt(j.state); throw new Error(j.error || "Request failed"); }
    if ("connected" in j) adopt(j);
    return j;
  } finally { if (busyText) { busy = false; $("#busy").classList.remove("show"); } }
}
function toast(msg, kind = "") { const t = $("#toast"); t.textContent = msg; t.className = "show " + kind; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", kind === "err" ? 6000 : 2400); }
async function run(fn, okMsg) { try { await fn(); if (okMsg) toast(okMsg, "good"); } catch (e) { toast(e.message, "err"); } render(); }
function confirmDlg(text, yes = "OK") {
  return new Promise(res => { const d = $("#dlg"); $("#dlgText").textContent = text; $("#dlgYes").textContent = yes;
    $("#dlgYes").onclick = () => { d.close(); res(true); }; $("#dlgNo").onclick = () => { d.close(); res(false); }; d.oncancel = () => res(false); d.showModal(); });
}
function adopt(state) {
  const was = S && S.connected, wasDemo = S && S.demo;
  S = state;
  if (S.connected && (!was || wasDemo !== S.demo || !draftKeys)) resetDrafts();
  if (!S.connected) { draftKeys = null; draftFn = null; paint = null; lightDraft = null; macroDraft = null; recording = false; }
}
function resetDrafts() {
  draftKeys = clone(S.config.keymap); draftFn = clone(S.config.fnmap); selKey = null; lightDraft = clone(S.config.light); paint = clone(S.config.perkey);
  macroDraft = null; macroSel = 0;
}
const keysDirty = () => draftKeys && (draftKeys.some((e, i) => !same(e, S.config.keymap[i])) || draftFn.some((e, i) => !same(e, S.config.fnmap[i])));
const paintDirty = () => paint && Object.keys(paint).some(k => paint[k] !== S.config.perkey[k]);

/* ---------- chrome ---------- */
const TABS = [["keys", "Keys"], ["light", "Lighting"], ["macros", "Macros"], ["settings", "Settings"], ["profiles", "Profiles"], ["help", "Shortcuts"]];
function renderChrome() {
  const p = $("#pill");
  p.className = "pill" + (S.connected ? (S.demo ? " demo" : " on") : "");
  p.lastElementChild.textContent = S.connected ? (S.demo ? "Demo keyboard (nothing is written to hardware)" : "VN66 connected · USB · firmware " + S.info.firmware) : "Not connected";
  $("#demoBtn").textContent = S.demo ? "Leave demo" : "Demo mode";
  const nav = $("#nav"); nav.replaceChildren();
  for (const [id, label] of TABS) {
    const dirty = (id === "keys" && keysDirty()) || (id === "light" && paintDirty());
    nav.append(el("button", {class: tab === id ? "sel" : "", onclick: () => { tab = id; stopRecording(); render(); if (id === "profiles" && S.connected) loadProfiles().then(render, () => {}); }}, label + (dirty ? " •" : "")));
  }
  nav.append(el("div", {class: "foot"}, "Unofficial tool. Not affiliated with Dukharo."));
}
function render() {
  if (!S) return;
  renderChrome();
  const v = $("#view"); const scroll = v.scrollTop;
  v.replaceChildren(...(tab === "help" ? viewHelp() : !S.connected ? viewDisconnected() : {keys: viewKeys, light: viewLight, macros: viewMacros, settings: viewSettings, profiles: viewProfiles}[tab]()).flat(Infinity).filter(Boolean));
  v.scrollTop = scroll;
}
function viewDisconnected() {
  return [el("div", {class: "empty-state"},
    el("h2", {}, "Connect your VN66 by cable"),
    el("p", {class: "sub", style: "margin:0 auto"}, S.problem || "Looking for the keyboard…"),
    el("ol", {class: "steps"}, el("li", {}, "Plug the USB-C cable into the keyboard and this PC."), el("li", {}, "Press ", el("kbd", {}, "Fn"), " + ", el("kbd", {}, "T"), " to switch the keyboard to wired mode."),
      el("li", {}, "Close the stock Dukharo Driver app if it is running.")),
    el("p", {class: "note"}, "The keyboard only accepts settings over USB. Once saved they stay in the keyboard and keep working over 2.4G and Bluetooth."),
    S.conflict.length ? el("p", {}, el("button", {class: "btn primary", onclick: async () => { if (await confirmDlg("Stop " + S.conflict.join(", ") + "? Windows will ask for permission, because the stock driver runs as administrator. It will start again next time you open the stock Dukharo app.", "Stop it")) run(() => api("/api/stopStock", {}, "Stopping the stock driver…")); }}, "Stop the stock driver")) : null,
    el("button", {class: "btn", onclick: () => run(() => api("/api/demo", {on: true}))}, "Explore with a demo keyboard"))];
}

/* ---------- keyboard drawing ---------- */
function drawKeyboard(opts) {
  const kb = el("div", {class: "kb"});
  const u = n => `calc(var(--u)*${n})`;
  for (const k of KEYS) {
    const b = el("button", {class: "key", style: `left:${u(k.x)};top:${u(k.y)};width:calc(var(--u)*${k.w} - 6px);height:calc(var(--u) - 6px)`});
    opts.paint(b, k, false); kb.append(b);
  }
  knobKeys().forEach((k, n) => {
    const b = el("button", {class: "key " + (n === 1 ? "knob" : "knobside"), title: k.l,
      style: n === 1 ? `left:calc(var(--u)*15 + 9px);top:0;width:calc(var(--u) - 24px);height:calc(var(--u) - 24px)` :
        `left:calc(var(--u)*${n ? 15.5 : 15} - ${n ? 1 : 0}px);top:calc(var(--u) - 22px);width:calc(var(--u)*.5 - 5px);height:16px;box-shadow:none`});
    opts.paint(b, k, true); kb.append(b);
  });
  return el("div", {class: "kbwrap"}, kb);

      el("button", {class: "btn", onclick: () => file.click()}, "Import file…"), file),
      (keysDirty() || paintDirty()) && el("p", {class: "note", style: "margin:10px 0 0"}, "You have unwritten changes. Profiles capture what is stored on the keyboard, so write them first.")),
    el("h3", {}, "Saved profiles"), el("div", {class: "card"}, rows(profileList.profiles, false)),
    el("h3", {}, "Automatic backups"), el("div", {class: "card"}, el("p", {class: "note", style: "margin-top:0"}, "Taken the first time the keyboard connects and before every profile write or factory reset."), rows(profileList.backups, true))];
}

/* ---------- Shortcuts ---------- */
function viewHelp() {
  const K = (...k) => k.flatMap((x, i) => [i ? " + " : "", el("kbd", {}, x)]);
  const groups = [["Connection", [[K("Fn", "T"), "Wired (USB) mode"], [K("Fn", "R"), "2.4G receiver"], [K("Fn", "Q"), "Bluetooth 1"], [K("Fn", "W"), "Bluetooth 2"], [K("Fn", "E"), "Bluetooth 3"]]],
    ["Lighting", [[K("Fn", "\\"), "Next lighting effect"], [K("Fn", "P"), "Next colour"], [K("Fn", "Backspace"), "Lighting on / off"], [K("Fn", "↑"), "Brighter"], [K("Fn", "↓"), "Dimmer"], [K("Fn", "→"), "Faster"], [K("Fn", "←"), "Slower"]]],
    ["Missing keys", [[K("Fn", "1…0, -, ="), "F1 … F12"], [K("Fn", "Esc"), "` and ~"], [K("Fn", "PgDn"), "Delete"], [K("Fn", "U"), "Print Screen"], [K("Fn", "I"), "Scroll Lock"], [K("Fn", "O"), "Pause"], [K("Fn", "J"), "Insert"], [K("Fn", "K"), "Home"], [K("Fn", "L"), "End"]]],
    ["Media", [[K("Fn", "A"), "Play / pause"], [K("Fn", "S"), "Previous track"], [K("Fn", "D"), "Next track"], ["Knob", "Turn for volume, press to mute"]]],
    ["System", [[K("Fn", "Win"), "Lock the Windows key"], [K("Fn", "L Alt"), "Hold 3 s: switch Windows / Mac layout"], [K("Fn", "L Alt", "Space"), "Hold 3 s: power-saving mode"], [K("L Ctrl", "L Alt", "Q"), "Hold 3 s: factory reset"]]]];
  return [el("h2", {}, "Built-in shortcuts"), el("p", {class: "sub"}, "These Fn combinations are part of the keyboard's firmware and work without any software."),
    el("div", {style: "display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px"}, groups.map(([name, rows]) => el("div", {class: "card"}, el("h3", {style: "margin-top:0"}, name), el("table", {}, rows.map(([k, d]) => el("tr", {}, el("td", {style: "white-space:nowrap"}, k), el("td", {}, d)))))))];
}

/* ---------- boot ---------- */
$("#demoBtn").onclick = () => run(() => api("/api/demo", {on: !S.demo}));
async function tick() {
  if (!busy && S) {
    try {
      const was = S.connected, prob = S.problem;
      await api("/api/state");
      if (was !== S.connected || (!S.connected && prob !== S.problem)) { if (S.connected) await loadProfiles(); render(); } else renderChrome();
    } catch (e) { $("#pill").className = "pill"; $("#pill").lastElementChild.textContent = "VN66 Studio has stopped. Close this window and start it again."; }
  }
  setTimeout(tick, 2000);
}
if (TABS.some(t => t[0] === location.hash.slice(1))) tab = location.hash.slice(1);
(async () => { try { await api("/api/state"); await loadProfiles(); } catch (e) { toast(e.message, "err"); } render(); setTimeout(tick, 2000); })();
</script>
